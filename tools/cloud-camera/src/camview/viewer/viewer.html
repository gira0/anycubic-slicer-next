<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anycubic camera</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0 0 36px 0; background: #000; }
  #video { width: 100%; height: 100%; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 36px; display: flex; gap: 8px;
         align-items: center; padding: 0 10px; background: #1b1b1b; box-sizing: border-box; }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: #444; }
</style>
</head>
<body>
<div id="stage"><div id="video"></div></div>
<div id="bar">
  <span id="status" role="status" aria-live="polite">Waiting for a session from the slicer…</span>
  <button id="unmute" hidden>Unmute</button>
  <button id="fs">Fullscreen</button>
</div>
<script>
const token = '__CAMVIEW_TOKEN__';  // filled in by the helper
const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $('status').textContent = t; $('status').title = t; document.title = 'Anycubic camera - ' + t; };
let seq = 0, client = null, audioTrack = null, publishTimer = null;
// The stream is H.264. Firefox-based browsers may need the OpenH264 plugin for it.
const GECKO_HINT = navigator.userAgent.includes('Gecko/')
  ? ' In Firefox, also check that the OpenH264 plugin is enabled (about:addons, Plugins).' : '';

function b64ToBytes(b64) {
  const raw = atob(b64), out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function leave() {
  clearTimeout(publishTimer);
  if (client) { try { await client.leave(); } catch (e) {} client = null; }
  audioTrack = null; $('unmute').hidden = true; $('video').replaceChildren();
}

async function join(session) {
  await leave();
  const sw = session.shengwang, name = (session.printer && session.printer.name) || 'printer';
  setStatus('Connecting to ' + name + '…');
  // Same configuration as the slicer's AgoraConnectionManager.
  client = AgoraRTC.createClient({ mode: 'live', codec: 'h264', role: 'host' });
  const c = client;
  c.on('connection-state-change', (cur, prev, reason) => console.log('state', prev, '->', cur, reason));
  c.on('user-published', async (user, mediaType) => {
    try { await c.subscribe(user, mediaType); } catch (e) { setStatus('Subscribe failed: ' + e.message); return; }
    if (mediaType === 'video') {
      clearTimeout(publishTimer);  // only video counts; audio alone must not hide the warning
      user.videoTrack.play('video'); setStatus('Live: ' + name);
    }
    if (mediaType === 'audio') { audioTrack = user.audioTrack; $('unmute').hidden = false; }
  });
  c.on('user-unpublished', (user, mediaType) => { if (mediaType === 'video') setStatus('Camera stopped'); });
  c.on('user-left', () => setStatus('Printer left the channel'));
  c.on('exception', (e) => console.warn('exception', e.code, e.msg));
  const mode = String(sw.encryption_mode || '').toLowerCase().split('_').join('-');
  if (mode && sw.encryption_key && sw.encryption_kdf_salt) {
    await c.setEncryptionConfig(mode, String(sw.encryption_key), b64ToBytes(sw.encryption_kdf_salt));
  }
  await c.join(sw.appid, sw.channel, sw.rtc_token || null, sw.client_uid || null);
  setStatus('Joined, waiting for the printer camera…');
  publishTimer = setTimeout(() => setStatus('Joined, but the printer is not publishing video (is the camera on?)' + GECKO_HINT), 20000);
}

// A failed poll does not mean the slicer was closed: a suspend/resume or a network
// change aborts even loopback requests for a while. Only the helper's "closed"
// notice ends polling. After GIVE_UP_AFTER failed polls in a row (about a minute)
// the channel is left, but polling goes on slowly and recovers.
const POLL_MS = 1500, SLOW_POLL_MS = 5000, WARN_AFTER = 3, GIVE_UP_AFTER = 40;
let failures = 0, savedStatus = null, gaveUp = false;
async function poll() {
  let delay = POLL_MS;
  try {
    const r = await fetch('/session?t=' + encodeURIComponent(token) + '&since=' + seq, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    failures = 0;
    if (j.closed) {
      await leave();
      setStatus('The slicer was closed. You can close this window.');
      window.close();  // only allowed in some browsers; harmless otherwise
      return;
    }
    if (savedStatus !== null) { setStatus(savedStatus); savedStatus = null; }
    if (gaveUp) {
      gaveUp = false; seq = -1;  // the channel was left: take the helper's session again
      setStatus('Reconnected to the helper. Press play in the slicer to restart the video.');
    }
    if (j.seq !== seq) {
      seq = j.seq;
      if (j.session) await join(j.session).catch((e) => setStatus('Error: ' + (e.code || '') + ' ' + (e.message || e)));
    }
  } catch (e) {
    failures++;
    if (failures === WARN_AFTER) {
      savedStatus = $('status').textContent;
      setStatus('Lost connection to the helper, retrying…');
    }
    if (failures === GIVE_UP_AFTER) {
      await leave();
      gaveUp = true; savedStatus = null;
      setStatus('No connection to the helper, still retrying. If the slicer was closed, close this window.');
    }
    if (gaveUp) delay = SLOW_POLL_MS;
  }
  setTimeout(poll, delay);
}

$('unmute').onclick = () => { if (audioTrack) { audioTrack.play(); $('unmute').hidden = true; } };
$('fs').onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
window.addEventListener('beforeunload', () => { if (client) client.leave(); });
const s = document.createElement('script');
s.src = '/agora.js?t=' + encodeURIComponent(token);
s.onload = poll;
s.onerror = () => setStatus('Could not load the Agora SDK. Its first use needs internet access to download it; close this window and press play again.');
document.head.appendChild(s);
</script>
</body>
</html>
