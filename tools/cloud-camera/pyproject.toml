[project]
name = "camview"
version = "0.1.0"
description = "Prototype: view Anycubic cloud printer cameras on Linux in a WebRTC-capable browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
camview = "camview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camview"]
