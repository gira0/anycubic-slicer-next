name: Build Anycubic Slicer AppImage

on:
  schedule:
    - cron: '17 3 * * *'
  # Packaging changes ship on merge when appimage/PACKAGE_REVISION is bumped. A
  # push without a bump finds complete releases and builds nothing.
  push:
    branches: [main]
    paths:
      - 'appimage/**'
      - 'tools/cloud-camera/**'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:

permissions:
  contents: read

# Runs must not publish the same release at once.
concurrency:
  group: appimage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect published application version
        id: version
        run: ./appimage/check-latest.sh

      - name: Check release completeness
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          if [[ -z "$APP_VERSION" ]]; then
            echo "No application version detected (upstream unavailable); skipping build."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="$RELEASE_VERSION"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          required_assets=$(printf '%s\n' \
            "AnycubicSlicer-${RELEASE_VERSION}-x86_64.AppImage" \
            "AnycubicSlicer-x86_64.AppImage" \
            "AnycubicSlicer-x86_64.AppImage.zsync")

          view_status=0
          assets=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>"$RUNNER_TEMP/view-error.txt") || view_status=$?
          if (( view_status != 0 )); then
            # Only a missing release means "build"; any other API error fails the run.
            if grep -qi 'release not found' "$RUNNER_TEMP/view-error.txt"; then
              echo "No release exists for $release_tag."
              echo 'should_build=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/view-error.txt" >&2
            exit "$view_status"
          fi

          missing_assets=$(comm -23 <(printf '%s\n' "$required_assets" | sort) <(printf '%s\n' "$assets" | sort))
          if [[ -n "$missing_assets" ]]; then
            echo "Release $release_tag is incomplete; missing:"
            printf '%s\n' "$missing_assets"
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo "Release $release_tag is complete; skipping build."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.release.outputs.should_build == 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y binutils curl libfuse2t64 zsync

      - name: Build latest AppImage
        id: build
        if: steps.release.outputs.should_build == 'true'
        env:
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: ./appimage/build-latest.sh

      - name: Publish release when the release tag is new
        if: steps.release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          CAMVIEW_PATCH: ${{ steps.build.outputs.camview_patch }}
          VERSIONED_APPIMAGE: ${{ steps.build.outputs.versioned_appimage }}
          LATEST_APPIMAGE: ${{ steps.build.outputs.latest_appimage }}
          ZSYNC: ${{ steps.build.outputs.zsync }}
        run: |
          revision="${RELEASE_VERSION##*-}"
          notes="Anycubic Slicer Next $APP_VERSION as AppImage (packaging revision $revision). The AppImage includes AppImageUpdate metadata."
          # Releases must stay regular ones (never pre-releases): the AppImage's
          # update string follows "latest", which skips pre-releases.
          if [[ "$CAMVIEW_PATCH" == failed ]]; then
            notes+=" Cloud camera viewing does not work with this slicer version yet (the camview web UI patch does not apply); everything else is unaffected."
          else
            notes+=" Cloud printer cameras open in a browser window (needs python3 3.11 or newer and a Chromium-family browser or Firefox on the host); turn that off with CAMVIEW=0 or --no-camview."
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$VERSIONED_APPIMAGE" \
              "$LATEST_APPIMAGE" \
              "$ZSYNC"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "$VERSIONED_APPIMAGE" \
              "$LATEST_APPIMAGE" \
              "$ZSYNC"
          fi