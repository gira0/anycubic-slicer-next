name: Build Anycubic Slicer AppImage

on:
  # The schedule and pushes build both variants.
  schedule:
    - cron: '17 3 * * *'
  # Packaging changes ship on merge when appimage/PACKAGE_REVISION is bumped. A
  # push without a bump finds complete releases and builds nothing.
  push:
    branches: [main]
    paths:
      - 'appimage/**'
      - 'tools/cloud-camera/**'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'original: the regular AppImage. camview: AppImage with the cloud-camera tool, released as <version>-<revision>-camview. both: build both.'
        type: choice
        options:
          - both
          - original
          - camview
        default: both

permissions:
  contents: read

# Runs must not publish the same release at once.
concurrency:
  group: appimage-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      # One stream failing must not stop the other.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'original' && '["original"]' || inputs.variant == 'camview' && '["camview"]' || '["original","camview"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect published application version
        id: version
        run: ./appimage/check-latest.sh

      - name: Check release completeness
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ -z "$APP_VERSION" ]]; then
            echo "No application version detected (upstream unavailable); skipping build."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The camview stream has its own tag and asset names, so it never
          # touches the release (or the Latest badge) of the original stream.
          release_tag="$RELEASE_VERSION"
          name_suffix=''
          if [[ "$VARIANT" == camview ]]; then
            release_tag="${RELEASE_VERSION}-camview"
            name_suffix='-camview'
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          required_assets=$(printf '%s\n' \
            "AnycubicSlicer-${RELEASE_VERSION}${name_suffix}-x86_64.AppImage" \
            "AnycubicSlicer${name_suffix}-x86_64.AppImage" \
            "AnycubicSlicer${name_suffix}-x86_64.AppImage.zsync")

          view_status=0
          assets=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>"$RUNNER_TEMP/view-error.txt") || view_status=$?
          if (( view_status != 0 )); then
            # Only a missing release means "build"; any other API error fails the run.
            if grep -qi 'release not found' "$RUNNER_TEMP/view-error.txt"; then
              echo "No release exists for $release_tag."
              echo 'should_build=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/view-error.txt" >&2
            exit "$view_status"
          fi

          missing_assets=$(comm -23 <(printf '%s\n' "$required_assets" | sort) <(printf '%s\n' "$assets" | sort))
          if [[ -n "$missing_assets" ]]; then
            echo "Release $release_tag is incomplete; missing:"
            printf '%s\n' "$missing_assets"
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo "Release $release_tag is complete; skipping build."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.release.outputs.should_build == 'true'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y binutils curl libfuse2t64 zsync

      - name: Build latest AppImage
        id: build
        if: steps.release.outputs.should_build == 'true'
        env:
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VARIANT: ${{ matrix.variant }}
        run: ./appimage/build-latest.sh

      - name: Publish release when the release tag is new
        if: steps.release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VARIANT: ${{ matrix.variant }}
          VERSIONED_APPIMAGE: ${{ steps.build.outputs.versioned_appimage }}
          LATEST_APPIMAGE: ${{ steps.build.outputs.latest_appimage }}
          ZSYNC: ${{ steps.build.outputs.zsync }}
        run: |
          revision="${RELEASE_VERSION##*-}"
          # Extra create flags for camview only. Pre-release keeps AppImageUpdate
          # on the camview stream (its update string follows "latest-pre"), and
          # --latest=false means it can never take the Latest badge.
          create_args=()
          notes="Anycubic Slicer Next $APP_VERSION as AppImage (packaging revision $revision). The AppImage includes AppImageUpdate metadata."
          if [[ "$VARIANT" == camview ]]; then
            create_args=(--latest=false --prerelease)
            notes="Anycubic Slicer Next $APP_VERSION as AppImage (packaging revision $revision) with the camview cloud camera tool (run it with: <AppImage> camview run). Separate from the regular releases. The AppImage includes AppImageUpdate metadata and updates only from camview releases."
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$VERSIONED_APPIMAGE" \
              "$LATEST_APPIMAGE" \
              "$ZSYNC"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "${create_args[@]}" \
              "$VERSIONED_APPIMAGE" \
              "$LATEST_APPIMAGE" \
              "$ZSYNC"
          fi